name: Test

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch: {}

jobs:
    busted:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                nvim_version: [stable, nightly]

        steps:
            - uses: actions/checkout@v7

            - uses: nvim-neorocks/nvim-busted-action@v1
              with:
                  nvim_version: ${{ matrix.nvim_version }}
